<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datenschutzerklärung - AquaRevier</title>
    
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css"/>
    <style>
        :root {
            --bg-base: #0b0f19;
            --bg-surface: rgba(17, 24, 39, 0.8);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-primary: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
        }

        body.light-theme {
            --bg-base: #f1f5f9;
            --bg-surface: rgba(255, 255, 255, 0.9);
            --border-color: rgba(0, 0, 0, 0.08);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-primary: #4f46e5;
            --accent-glow: rgba(79, 70, 229, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Glassmorphism Container */
        .container {
            max-width: 800px;
            width: 100%;
            margin: 40px auto;
            background: var(--bg-surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        /* Navigation Header */
        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--accent-primary);
        }

        .theme-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 50%;
            font-size: 14px;
            width: 36px;
            height: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: var(--text-primary);
            transition: background 0.2s, border-color 0.2s;
        }

        .theme-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent-primary);
        }

        /* Content Styling */
        .content h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #a5b4fc, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        body.light-theme .content h1 {
            background: linear-gradient(135deg, #4f46e5, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .content h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 20px;
            font-weight: 600;
            margin: 28px 0 14px 0;
            color: var(--text-primary);
        }

        .content h3 {
            font-size: 16px;
            font-weight: 600;
            margin: 18px 0 10px 0;
            color: var(--text-primary);
        }

        .content p {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-lg);
        }

        .content hr {
            border: 0;
            border-top: 1px solid var(--border-color);
            margin: 24px 0;
        }

        .content ul {
            margin-bottom: var(--spacing-lg);
            padding-left: 20px;
        }

        .content li {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .content a {
            color: var(--accent-primary);
            text-decoration: none;
        }

        .content a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
            padding: var(--spacing-lg);
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
            margin-top: 20px;
        }

        .error-message a {
            color: #ef4444;
            text-decoration: underline;
            font-weight: 500;
        }

        @media (max-width: 640px) {
            .container {
                padding: 24px;
                margin: 10px auto;
            }
            .content h1 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body class="light-theme">
    <div class="container">
        <div class="nav-header">
            <a href="index.html" class="back-link">← Zurück zur Karte</a>
            <button id="theme-toggle" class="theme-btn" title="Farbschema wechseln">🌙</button>
        </div>
        
        <div class="content" id="legal-content">
            <p>Inhalt wird geladen...</p>
        </div>
    </div>

    <script>
        // Set initial theme based on localStorage
        const themeToggle = document.getElementById('theme-toggle');
        let isDarkMode = localStorage.getItem('theme') === 'dark';

        function updateThemeUI() {
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                themeToggle.innerText = '☀️';
            } else {
                document.body.classList.add('light-theme');
                themeToggle.innerText = '🌙';
            }
        }

        updateThemeUI();

        themeToggle.addEventListener('click', () => {
            isDarkMode = !isDarkMode;
            localStorage.setItem('theme', isDarkMode ? 'dark' : 'light');
            updateThemeUI();
        });

        // Simple Markdown Parser (Client-Side)
        function parseMarkdown(md) {
            // Escape HTML to prevent XSS
            let html = md
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");

            // Strip HTML Comments
            html = html.replace(/<!--[\s\S]*?-->/g, "");

            // Headers
            html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
            html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
            html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');

            // Horizontal Rule
            html = html.replace(/^\s*---\s*$/gim, '<hr>');

            // Split into block elements by double newlines
            const blocks = html.split(/\n\n+/);
            
            return blocks.map(block => {
                block = block.trim();
                if (!block) return '';
                if (block.startsWith('<h') || block.startsWith('<hr')) return block;
                
                // Lists
                if (block.startsWith('- ') || block.startsWith('* ')) {
                    const items = block.split(/\n[*-] /);
                    items[0] = items[0].replace(/^[*-] /, '');
                    const listHtml = items.map(item => `<li>${parseInline(item)}</li>`).join('');
                    return `<ul>${listHtml}</ul>`;
                }
                
                return `<p>${parseInline(block)}</p>`;
            }).join('\n');
        }

        function parseInline(text) {
            // Bold: **text**
            text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            // Links: [text](url)
            text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
            // Line breaks: double spaces followed by newline
            text = text.replace(/  \n/g, '<br>');
            return text;
        }

        // Fetch and render the legal markdown content
        async function fetchAndRender() {
            const contentDiv = document.getElementById('legal-content');
            try {
                const response = await fetch('legal/datenschutz.md');
                if (!response.ok) {
                    throw new Error(`Server lieferte HTTP ${response.status}`);
                }
                const markdown = await response.text();
                contentDiv.innerHTML = parseMarkdown(markdown);
            } catch (error) {
                console.error("Fehler beim Laden der Datenschutzerklärung:", error);
                contentDiv.innerHTML = `
                    <div class="error-message">
                        <strong>Fehler beim Laden des Inhalts</strong><br>
                        Die Datenschutzerklärung konnte nicht automatisch geladen werden. Sie können die Textdatei direkt hier einsehen:<br>
                        <a href="legal/datenschutz.md" target="_blank">legal/datenschutz.md</a>
                    </div>
                `;
            }
        }

        fetchAndRender();
    </script>
</body>
</html>
