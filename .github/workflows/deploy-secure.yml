name: Deploy Production to Surge.sh (secure)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Surge
        run: npm install -g surge

      - name: Deploy to Surge (production)
        env:
          SURGE_LOGIN: dtunder-x2a8v@surge.sh
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          sed -i '/internal.html/d' .surgeignore
          surge . adb-aquarevier-secure.surge.sh --token $SURGE_TOKEN

      - name: Deployment Summary
        run: |
          echo "✅ Deployed to https://adb-aquarevier-secure.surge.sh"
          echo "📅 Deployed at: $(date)"
          echo "📦 Commit: ${{ github.sha }}"
